[paths]
train = "training/data/train.spacy"
dev = "training/data/dev.spacy"
vectors = null
init_tok2vec = null

[system]
seed = 42
gpu_allocator = null

[nlp]
lang = "en"
pipeline = ["tok2vec", "ner"]
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null
batch_size = 1000

[corpora]

[training]
train_corpus = "corpora.train"
dev_corpus = "corpora.dev"
dropout = 0.15
max_steps = 320
eval_frequency = 20
patience = 100
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
accumulate_gradient = 1
max_epochs = 0
frozen_components = []
annotating_components = []
before_to_disk = null
before_update = null

[initialize]
vectors = ${paths.vectors}
init_tok2vec = ${paths.init_tok2vec}
vocab_data = null
lookups = null
before_init = null
after_init = null

[components]

[pretraining]

[nlp.tokenizer]
@tokenizers = "spacy.Tokenizer.v1"

[nlp.vectors]
@vectors = "spacy.Vectors.v1"

[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}
gold_preproc = false
max_length = 0
limit = 0
augmenter = null

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}
gold_preproc = false
max_length = 0
limit = 0
augmenter = null

[training.optimizer]
@optimizers = "Adam.v1"
learn_rate = 0.00015
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 1e-08

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
size = 256
discard_oversize = false
tolerance = 0.2
get_length = null

[training.score_weights]
ents_f = 1.0
ents_p = 0.0
ents_r = 0.0
ents_per_type = null

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[initialize.tokenizer]

[initialize.components]

[components.tok2vec]
source = "en_core_web_sm"

[components.ner]
source = "en_core_web_sm"